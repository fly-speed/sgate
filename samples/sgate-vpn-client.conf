# Independent macOS/Linux IPv4 VPN client. Stop OpenVPN before testing full-tunnel routes.
role = client
# Replace with your actual hostname; the certificate SAN must cover it.
# QUIC/UDP example: quic://vpn.example.com:8444/vpn
# TLS/TCP example:  tcp://vpn.example.com:8444/vpn
# WSS/TCP example:  wss://vpn.example.com:8444/vpn
# TCP always uses TLS. TCP/WSS requires tcp-listen in the standalone server configuration.
server = quic://vpn.example.com:8444/vpn
key-file = /opt/soft/sgate/conf/sgate.key
# Empty uses system trust; test self-signed certificates require this file.
tls-ca = /opt/soft/sgate/conf/tls-cert.pem
vpn-network = 10.77.0.0/24
# The server assigns this client a virtual IPv4 address after authentication.
mtu = 1280
# Empty creates a new utunN on macOS or sgate0 on Linux.
tun-name = ''
manage-network = true
routes = 0.0.0.0/1,128.0.0.0/1
# First version does not forward IPv6. Capture/discard it instead of letting it bypass VPN.
block-ipv6 = true
dns = 1.1.1.1
# macOS: match your actual network service; Linux: ignored (requires resolvectl).
dns-service = Wi-Fi

# Per-connection padding payload bytes/second; K/M supported, 0 disables, maximum 10M.
noise-rate = 0
# Padding during business IP traffic and idle periods, independently configurable.
noise-traffic = true
noise-idle = true
# Business IP inactivity threshold; zero uses 1s.
noise-idle-after = 1s

# Optional queued IP expiry; keep 0 for weak-link TCP. Maximum 1m.
queue-max-age = 0s
# Minimum gap between bulk raw UDP VPN packets; 0 disables, maximum 10ms.
udp-send-interval = 0s

# Raw UDP alternative: udp://vpn.example.com:8445/vpn (uses the same shared key).
