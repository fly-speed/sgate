# Independent IPv4 VPN gateway. Run on macOS/Linux with administrator privileges.
role = server
# Separate UDP listener; cannot share a UDP port already owned by sgate-server.
listen = 0.0.0.0:8444
# Optional shared TLS/TCP and WSS listener; leave listen empty for TCP/WSS only.
tcp-listen = ''
key-file = /opt/soft/sgate/conf/sgate.key
tls-cert = /opt/soft/sgate/conf/tls-cert.pem
tls-key = /opt/soft/sgate/conf/tls-key.pem
vpn-network = 10.77.0.0/24
mtu = 1280
max-clients = 64
manage-network = true
# Empty detects the physical route to 1.1.1.1; set e.g. en0 on macOS or eth0 on Linux if necessary.
egress-interface = ''
# Deny access to private server-side networks by default; the VPN gateway itself is allowed.
allow-private = false

# Per-connection padding payload bytes/second; K/M supported, 0 disables, maximum 10M.
noise-rate = 0
# Padding during business IP traffic and idle periods, independently configurable.
noise-traffic = true
noise-idle = true
# Business IP inactivity threshold; zero uses 1s.
noise-idle-after = 1s

# Optional queued IP expiry; keep 0 for weak-link TCP. Maximum 1m.
queue-max-age = 0s
