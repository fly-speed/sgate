# UTF-8 application configuration. Explicit command-line flags override these values.
# Paths are relative to the process working directory.
listen = 127.0.0.1:9000
server = ws://127.0.0.1:8080/tunnel
key-file = sgate.key
password = 'replace-with-your-password'
tls-ca =
reconnect-min = 250ms
reconnect-max = 10s
offline-timeout = 2m
max-streams = 128
buffer-bytes = 4194304
heartbeat = 20s
heartbeat-timeout = 0
noise-interval = 0
# Set both bounds to 1s and 3s to enable random padding intervals.
noise-interval-min = 0
noise-interval-max = 0
noise-min-bytes = 1024
noise-max-bytes = 10240

# Optional independent Web management configuration; empty keeps it disabled.
# admin-config = conf/admin-client.conf
