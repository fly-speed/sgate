# 客户端 Web 管理配置；通过 -admin-config 加载，不与代理配置混用。
# 外部界面目录，包含 index.html、app.css、app.js；相对本配置文件解析。
web-dir = ../web/admin
# 相对路径均相对于本文件所在目录，而非进程工作目录。
listen = 127.0.0.1:9081
# 首次进入页面时创建管理员。此文件由程序生成，仅存加盐密码哈希。
users-file = admin-client-users.json
# 每个登录会话单独落盘，目录权限须为 0700；过期自动清理。
session-dir = admin-client-sessions
# 固定登录有效期，不随访问续期；重启管理进程后仍按原到期时间计算。
session-timeout = 12h
max-sessions = 128
# 首次初始化令牌自动生成，创建账号后删除。通过本机文件读取，不在日志中输出。
setup-token-file = admin-client-setup.token
# 默认只允许本机 HTTP。对外监听时必须同时配置管理界面 HTTPS 证书与私钥。
tls-cert =
tls-key =
