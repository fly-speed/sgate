# 服务端 Web 管理配置；通过 -admin-config 加载，与业务 WebSocket 监听相互独立。
# 外部界面目录，包含 index.html、app.css、app.js；相对本配置文件解析。
web-dir = ../web/admin
# 相对路径均相对于本文件所在目录。
listen = 127.0.0.1:9082
# 初次访问页面主动创建管理员，账号密码哈希单独保存，不复用代理密码。
users-file = admin-server-users.json
session-dir = admin-server-sessions
# 固定超时，重启管理进程后会话在有效期内仍然可用。
session-timeout = 12h
max-sessions = 128
setup-token-file = admin-server-setup.token
# 非回环地址监听必须使用 HTTPS。
tls-cert =
tls-key =
